<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Love Slides • ATIRA'S JOURNEY</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/style_1.css"><link rel="stylesheet" href="css/style_2.css"><link rel="stylesheet" href="css/style_3.css"><link rel="stylesheet" href="css/love-slides.css"></head><body><header class="site-header"><div class="site-header-container"><a href="index.html" class="site-brand"><span class="site-brand-symbol">❤</span><span class="site-brand-text"><span class="site-brand-title">ATIRA'S JOURNEY</span><span class="site-brand-subtitle">OUR LITTLE UNIVERSE</span></span></a><button class="menu-toggle" id="menuToggle">☰</button><nav class="site-nav" id="siteNav"><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a href="gallery.html">Gallery</a><a class="active" href="love-slides.html">Love Slides</a><a href="videos.html">Videos</a><a href="timeline.html">Memories</a><a href="letters.html">Letters</a><a href="music.html">Music</a><a href="about.html">About</a><a class="vault-link" href="vault.html">🔐 Vault</a></nav></div></header><main class="ls-page"><div class="ls-wrap"><header class="ls-head"><span class="hero-label">OUR LITTLE ARCHIVE</span><h1>Love <span>Slides</span></h1><p>Not a timeline. Not a catalogue. Just little pieces of us, scattered like photographs on a bedroom floor.</p><div class="ls-meta"><span class="ls-pill">MASONRY MEMORY WALL</span><span class="ls-pill" id="lsCount">MEMORIES</span></div></header><section class="ls-mosaic" id="lsMosaic"></section></div></main><div class="ls-lightbox" id="lsLightbox"><button class="ls-close" id="lsClose">×</button><button class="ls-nav ls-prev" id="lsPrev">❮</button><img id="lsFull" alt="Memory"><button class="ls-nav ls-next" id="lsNext">❯</button><span class="ls-count" id="lsIndex"></span></div><script src="data/memories.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const all=(window.memories||[]).filter(m=>m&&m.type==='photo'&&m.src);const wall=document.getElementById('lsMosaic');const box=document.getElementById('lsLightbox');const full=document.getElementById('lsFull');const index=document.getElementById('lsIndex');let current=0;document.getElementById('lsCount').textContent=`${all.length} MEMORIES`;all.forEach((m,i)=>{const a=document.createElement('button');a.className='ls-item';a.innerHTML=`<img loading="lazy" src="${m.src}" alt="${m.title||'Memory'}"><span class="ls-caption"><span>${m.title||'A memory'}</span><span>${m.date||''}</span></span>`;a.onclick=()=>open(i);wall.appendChild(a)});function open(i){current=(i+all.length)%all.length;const m=all[current];full.src=m.src;full.alt=m.title||'Memory';index.textContent=`${current+1} / ${all.length}`;box.classList.add('open');document.body.style.overflow='hidden'}function close(){box.classList.remove('open');document.body.style.overflow=''}document.getElementById('lsClose').onclick=close;document.getElementById('lsNext').onclick=()=>open(current+1);document.getElementById('lsPrev').onclick=()=>open(current-1);box.onclick=e=>{if(e.target===box)close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='ArrowRight')open(current+1);if(e.key==='ArrowLeft')open(current-1)})});</script><script src="js/app.js"></script></body></html>
