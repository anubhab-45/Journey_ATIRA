<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Love Slides • ATIRA'S JOURNEY</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/style_1.css"><link rel="stylesheet" href="css/style_2.css"><link rel="stylesheet" href="css/style_3.css"><style>.love-page{padding:100px 0}.love-wrap{width:min(1100px,calc(100% - 28px));margin:auto}.love-head{text-align:center;margin-bottom:22px}.love-head h1{font:500 clamp(38px,6vw,64px) Cinzel,serif;margin:8px 0}.love-head h1 span{color:#d98aa8;display:block}.love-head p{color:#aaa;max-width:600px;margin:auto}.love-stage{position:relative;min-height:68vh;border-radius:28px;overflow:hidden;background:#09050d;display:grid;place-items:center;border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 90px rgba(0,0,0,.4)}#loveStageBg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(30px);opacity:.22;transform:scale(1.15)}#loveSlideImage{position:relative;z-index:2;max-width:calc(100% - 110px);max-height:58vh;object-fit:contain;border-radius:16px;box-shadow:0 25px 80px #0008;touch-action:pan-y}.love-arrow{position:absolute;z-index:4;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid #ffffff22;background:#0a050eaa;color:#fff;cursor:pointer}.love-arrow:hover{transform:translateY(-50%) scale(1.06)}#lovePrev{left:15px}#loveNext{right:15px}#loveSlideTitle,#loveSlideDate,#loveCounter{position:absolute;z-index:5;color:#fff}#loveSlideTitle{left:25px;bottom:43px;font:500 20px Cinzel,serif;margin:0}#loveSlideDate{left:25px;bottom:22px;margin:0;font-size:10px;opacity:.6}#loveCounter{right:25px;bottom:24px;font:13px Cinzel,serif;opacity:.7}#loveFirst{display:block;margin:18px auto;padding:9px 16px;border:1px solid #ffffff22;border-radius:999px;background:#ffffff08;color:#fff;cursor:pointer}@media(max-width:600px){.love-page{padding:85px 0}.love-stage{min-height:60vh;border-radius:20px}#loveSlideImage{max-width:calc(100% - 55px);max-height:52vh}.love-arrow{width:40px;height:40px}#lovePrev{left:8px}#loveNext{right:8px}}</style></head><body><header class="site-header" id="siteHeader"><div class="site-header-container"><a href="index.html" class="site-brand">❤ ATIRA'S JOURNEY</a><button class="menu-toggle" id="menuToggle">☰</button><nav class="site-nav" id="siteNav"><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a class="active" href="gallery.html">Gallery</a><a href="videos.html">Videos</a><a href="timeline.html">Memories</a><a href="letters.html">Letters</a><a href="about.html">About</a><a href="vault.html">🔐 Vault</a></nav></div></header><main class="love-page"><div class="love-wrap"><div class="love-head"><span class="hero-label">OUR LITTLE ARCHIVE</span><h1>Love <span>Slides</span></h1><p>One moment at a time. Swipe, tap, or use the arrows to travel through our memories.</p></div><section class="love-stage"><div id="loveStageBg"></div><button class="love-arrow" id="lovePrev">❮</button><img id="loveSlideImage" alt="Memory"><button class="love-arrow" id="loveNext">❯</button><h2 id="loveSlideTitle">Loading...</h2><p id="loveSlideDate"></p><span id="loveCounter">0 / 0</span></section><button id="loveFirst">↺ Start Again</button></div></main><script src="data/memories.js"></script><script src="js/love-slides.js"></script><script src="js/app.js"></script></body></html>
